name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon on macOS 14 and 15, and Intel.
        os: [macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Use Swift 6 (macOS 14 defaults to Xcode 15)
        run: |
          if swift --version 2>&1 | grep -q "Swift version 5"; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          fi
          swift --version
      - run: swift build
      - run: swift test
      - run: .build/debug/oomguard status
      - run: .build/debug/oomguard config -c config.example.toml
      - run: brew install tmux
      - run: scripts/e2e.sh
